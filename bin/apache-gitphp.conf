# GitPHP — standalone Apache config for WAMP's Apache 2.4 + PHP 8.4.15 (mod_php)
# Run with:
#   C:\wamp64\bin\apache\apache2.4.65\bin\httpd.exe -f <project>\bin\apache-gitphp.conf
#
# Why this exists: the PHP built-in server is single-threaded on Windows,
# so one slow request (clone, archive, idle keep-alive client) blocks every
# other request. Apache's winnt MPM serves requests on real worker threads.

ServerRoot "C:/wamp64/bin/apache/apache2.4.65"
Listen 127.0.0.1:8080
ServerName localhost:8080

PidFile "C:/Users/aljailane/Desktop/git/gitphp/storage/httpd.pid"
ErrorLog "C:/Users/aljailane/Desktop/git/gitphp/storage/httpd-error.log"
LogLevel warn

LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog "C:/Users/aljailane/Desktop/git/gitphp/storage/httpd-access.log" combined

# --- Modules ---
# Note: mpm_winnt is compiled into httpd.exe on Windows (not a loadable module)
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so
# PHP 8.4.15: use ONE version's module + runtime as a pair.
# Mixing php8.2.30's module with php8.4.15's php8ts.dll (picked up from the
# system PATH) crashes the Apache child process (access violation).
LoadModule php_module "C:/wamp64/bin/php/php8.4.15/php8apache2_4.dll"
# Project-local php.ini (bin\php.ini): Xdebug/OPcache omitted — they crash
# the Apache child on this WAMP build (see the ini header).
PHPINIDir "C:/Users/aljailane/Desktop/git/gitphp/bin"

# --- Process management: threaded MPM ---
<IfModule mpm_winnt_module>
    ThreadsPerChild 16
    MaxConnectionsPerChild 0
</IfModule>

# --- Document root (the app's public_html) ---
DocumentRoot "C:/Users/aljailane/Desktop/git/gitphp/public_html"
<Directory "C:/Users/aljailane/Desktop/git/gitphp/public_html">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted

    # Browser-cache static assets; Apache answers conditional revalidations
    # with 304 automatically (ETag / Last-Modified).
    <FilesMatch "\.(css|js|svg|png|jpe?g|gif|ico|woff2?)$">
        Header set Cache-Control "public, max-age=86400"
    </FilesMatch>
</Directory>

DirectoryIndex index.php
TypesConfig conf/mime.types
AddType application/x-httpd-php .php

# --- PHP runtime limits (main tuning lives in bin/php.ini) ---
<IfModule php_module>
    php_value upload_max_filesize 64M
    php_value post_max_size 64M
</IfModule>
