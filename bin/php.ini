; GitPHP minimal php.ini for Apache (mod_php).
; Xdebug and OPcache are intentionally OMITTED: with WAMP's PHP 8.4.15 they
; crash the Apache child (access violation in VCRUNTIME140.dll) even on a
; plain phpinfo() request. If a future PHP build fixes this, OPcache can be
; re-enabled here with a zend_extension line.

[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
serialize_precision = -1
zend.enable_gc = On
expose_php = Off
max_execution_time = 120
max_input_time = 60
memory_limit = 256M
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
log_errors_max_len = 1024
error_log = "C:/Users/aljailane/Desktop/git/gitphp/storage/php-error.log"
variables_order = "GPCS"
request_order = "GP"
register_argc_argv = Off
post_max_size = 64M
upload_max_filesize = 64M
max_file_uploads = 20
default_socket_timeout = 60

; Extensions — absolute extension_dir so nothing is resolved via PATH
extension_dir = "C:/wamp64/bin/php/php8.4.15/ext"
extension=curl
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=mysqli
extension=openssl
extension=pdo_mysql
extension=zip

[Date]
date.timezone = UTC

[Session]
session.save_handler = files
session.save_path = "C:/Users/aljailane/Desktop/git/gitphp/storage/sessions"
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.gc_maxlifetime = 86400

[opcache]
; left disabled — see note at top
opcache.enable = 0
