# ═══════════════════════════════════════════════════════════════════
#  GitPHP — OpenLiteSpeed configuration snippets
# ═══════════════════════════════════════════════════════════════════
#  These fragments are merged into the site's vHost configuration
#  (CyberPanel → Websites → <site> → vHost Conf).
#
#  GitPHP routes ALL traffic (including Smart HTTP git protocol)
#  through public_html/index.php via .htaccess, so no special
#  "context" is needed for .git paths — only generous limits.
# ═══════════════════════════════════════════════════════════════════

# ── 1. Rewrite (enable .htaccess processing) ──────────────────────
rewrite  {
  enable                  1
  RewriteFile             .htaccess
}

# ── 2. PHP LSAPI External App ─────────────────────────────────────
#    connTimeout / reqTimeout = 300s → long `git push` operations
#    maxReqBodySize = 500MB          → large pushes
#
#    NOTE: CyberPanel generates this block; only EDIT the three
#    limit values, do not duplicate the block.
extprocessor lsphp {
  type                    lsapi
  address                 UDS://tmp/lshttpd/lsphp.sock
  maxConns                10
  env                     PHP_LSAPI_CHILDREN=10
  initTimeout             60
  retryTimeout            0
  persistConn             1
  respBuffer              0
  autoStart               1
  path                    $SERVER_ROOT/fcgi-bin/lsphp5
  connTimeout             300
  reqTimeout              300
  maxReqBodySize          524288000
}

# ── 3. Script handler mapping (normally already present) ──────────
scripthandler  {
  add lsapi:lsphp php
}

# ── 4. Context for static assets (optional performance tweak) ─────
#    Serve CSS directly without hitting PHP.
context /assets/ {
  location                /home/git.example.com/public_html/assets/
  allowBrowse             1
  indexFiles              index.html
}

# ── 5. Disable caching for git protocol endpoints ─────────────────
#    Smart HTTP responses must never be cached or transformed.
#    Achieved via response headers set by GitHttpController:
#      Cache-Control: no-cache
#    No OLS-level configuration required; if page cache is enabled
#    on the server, exclude the site or add:
#
#    module cache {
#      checkPrivateCache   1
#      ...
#      excludeURI          /.git
#    }

# ── 6. Security notes ─────────────────────────────────────────────
#  * Repositories MUST live outside public_html (REPOS_PATH in .env).
#  * .env, config/, src/, vendor/, hooks/, bin/ must NOT be web
#    reachable — only public_html/ is the document root.
#  * After any vHost change: CyberPanel → Home → "Restart Litespeed".
